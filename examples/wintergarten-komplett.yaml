# ESP32 + CC1101 (868 MHz): Licht (RF-L LED-ST) und Markise (RF-MSG-ST) ueber Frames der Remo pro.
# Verdrahtung: CC1101 SCK -> GPIO18, MISO -> GPIO19, MOSI -> GPIO23, CSN -> GPIO5, GDO0 -> GPIO4, VCC -> 3,3 V, GND -> GND.

esphome:
  name: wintergarten

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG
api:
ota:
  - platform: esphome

external_components:
  - source: github://lighthousehh/esphome-elsner-arexa@remo-light-test
    components: [elsner_arexa, elsner_replay]

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

cc1101:
  - id: radio_arexa
    cs_pin: GPIO5
    gdo0_pin: GPIO4
    packet_mode: true
    packet_length: 64

elsner_arexa:
  id: arexa
  cc1101_id: radio_arexa
  # frequency: 868.19MHz  # 868,19 MHz + Abweichung Ihres Moduls (billige Module: +-40 kHz)

elsner_replay:
  id: replay
  cc1101_id: radio_arexa
  elsner_arexa_id: arexa

# --- Licht (Kanal 1 der Remo pro) ---
output:
  - platform: elsner_replay
    id: dimmer_out
    dim_time: 4s
    hold_delay: 1000ms
    switch_on:
      - cead93ba5dbb771e6390db992d80ca4fa5cf493478f09b366bd6ac59b162c4870d1a33672f3e
      - cead93bad7a85fee03d05b992e83cf58b7f372c79f3f2e5cb972e4c99223468d1b366cd89d2b
    switch_off:
      - cead93baecd4b08f44515c9a2f84d15dc107ca153a75c3870e1c376fddba74e8d1a24488f53a
      - cead93bad7a85fee03d05b992e83cf58b7f383c79f3f2e5cb972e4c99223468d1b366cd876ba
    dim_up:
      - cead93ba7acee8ff2411dc9a3087d86bdd3e27f1f2e5bf7ffefdf9f1e2c385091223468d44f8
      - cead93ba06e5185fe491dc9a3086d666d32b07a65dba83060d1a3469d2a3478e1d3a73e5504e
      - cead93ba7fd1ff2e83d05b992d80c94c9ec010f8000000000000fffefcf8efdebb76ebd639bf
    dim_down:
      - cead93baa239883fa411dc9a2f85d462cb1af061d2a5902142850913264c983060c07ffe315a
      - cead93ba69c7a77e2310db992d80c94da1c63f13376fb367cf9f3e7bf7edd9b163c78e1dd3a9
      - cead93baca84287f2411dc9a2f84d25ec209a51e4d9acb952b55aa54a953a64c993365c9e9ac

light:
  - platform: monochromatic
    name: Wintergarten Licht
    output: dimmer_out
    default_transition_length: 0s
    gamma_correct: 1.0
    restore_mode: ALWAYS_OFF

# --- Markise (zweiter Kanal der Remo pro) ---
globals:
  - id: markise_richtung
    type: int
    initial_value: '0'   # 1 = auf, -1 = ab

button:
  - platform: elsner_replay
    id: markise_auf_kurz
    name: Markise Auf kurz
    gap: 70ms
    frames:
      - cead93baecd4b08f44515c9a2f84d15dc107b9193a75c3870e1c376fddba74e8d1a24488cd6f
      - cead93bad7a85fee03d05b992e83cf58b7f372cb9f3f2e5cb972e4c99223468d1b366cd859b3
  - platform: elsner_replay
    id: markise_ab_kurz
    name: Markise Ab kurz
    gap: 70ms
    frames:
      - cead93ba43810f4ec3505b992d80ca4ea3ca502450a0c78e1b356ad4a74e9d3a74e8d0a1ef81
      - cead93ba75e2d7dee390db992d80c94c9fc3220818304c972e5cb76fdebc77edd9b366cc69f7
  - platform: elsner_replay
    id: markise_auf_fahren
    name: Markise Auf fahren
    gap: 1000ms
    frames:
      - cead93baecd4b08f44515c9a2f84d15dc107b9193a75c3870e1c376fddba74e8d1a24488cd6f
      - cead93ba75e2d7dee390db992d80c94c9fc3360818304c972e5cb76fdebc77edd9b366cc6baf
      - cead93bad99d67fe2310db992e83cf58b6f172c08810d4a84f9e3b76ecd9b264c88f1f3dbe8d
  - platform: elsner_replay
    id: markise_ab_fahren
    name: Markise Ab fahren
    gap: 1000ms
    frames:
      - cead93bab62dd8dfe491dc9a2f85d463cc1cf46de2c5f8f1e1c3850b172f5ebb76ecd8b195fc
      - cead93ba8edc389f6491dc9a2f85d361c917e15abd7a1223478e1c376ddab56ad5ab56ac1b64
  # Empfang neu starten (zur Diagnose)
  - platform: template
    name: Empfang neu starten
    on_press:
      - lambda: |-
          id(arexa).start_listening();
          ESP_LOGI("test", "Empfang neu gestartet");

cover:
  - platform: time_based
    id: markise
    name: Markise
    has_built_in_endstop: true
    open_duration: 21.80s
    close_duration: 22.11s
    open_action:
      - lambda: id(markise_richtung) = 1;
      - button.press: markise_auf_fahren
    close_action:
      - lambda: id(markise_richtung) = -1;
      - button.press: markise_ab_fahren
    stop_action:
      - if:
          condition:
            lambda: 'return id(markise).position > 0.0f && id(markise).position < 1.0f;'
          then:
            - if:
                condition:
                  lambda: 'return id(markise_richtung) == 1;'
                then:
                  - button.press: markise_ab_kurz
                else:
                  - button.press: markise_auf_kurz

sensor:
  - platform: elsner_arexa
    rc_rssi:
      name: Funk Pegel RC

text_sensor:
  - platform: elsner_arexa
    pairing:
      name: Pairing
    last_frame:
      name: Letzter Rahmen
